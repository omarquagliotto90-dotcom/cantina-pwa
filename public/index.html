<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA / iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` e non `black-translucent`: quest'ultimo chiede a iOS una
         webview a tutto schermo ancorata in alto, ma iOS gliene dà una alta
         quanto lo schermo MENO il safe-area superiore, e i 59px di ammanco
         restano come banda vuota in fondo (misurato 21/09/2026: viewport 873,
         schermo 932). Con `default` la webview parte sotto la status bar e
         arriva al fondo vero. Vedi CLAUDE.md per le tre strade già escluse. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cantina" />
    <meta name="theme-color" content="#9B3535" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icone iPhone (Apple touch icons) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>La Mia Cantina</title>

    <style>
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #FFF8F7;
        /* NON mettere safe-area qui: con overflow:hidden non funziona su Safari */
      }
      /* Foglio "aggiungi vino": il solo stato non esprimibile inline che vale
         la pena tenere. Gli :hover del ridisegno sono stati lasciati cadere —
         su iPhone non si attivano mai — ma il contorno di messa a fuoco serve
         a chi naviga da tastiera. */
      .foglio-foto:focus-visible { outline: 2px solid #6B1E2E; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <noscript>Abilita JavaScript per usare La Mia Cantina.</noscript>
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrato:', reg.scope))
            .catch(err => console.log('SW errore:', err));
        });
      }
    </script>
  </body>
</html>
